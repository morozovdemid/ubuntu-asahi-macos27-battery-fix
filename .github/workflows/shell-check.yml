name: Shell scripts
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck
        run: |
          shellcheck -s bash scripts/build.sh scripts/install.sh scripts/rollback.sh scripts/status.sh
          shellcheck -s bash -e SC2034 scripts/common.sh
